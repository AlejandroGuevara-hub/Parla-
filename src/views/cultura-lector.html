<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector PDF — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body>

  <parla-sidebar current="cultura"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="pdf-lector animate-in">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Navegación">
        <a href="cultura.html" class="breadcrumb__link">Cultura</a>
        <span class="breadcrumb__sep"><i class="fas fa-chevron-right"></i></span>
        <span class="breadcrumb__current" id="breadcrumb-chapter">Capítulo</span>
      </nav>

      <!-- Barra de controles (sticky) -->
      <div class="pdf-controls" id="pdf-controls">
        <div class="pdf-controls__group">
          <button class="pdf-controls__btn" id="btn-zoom-out" aria-label="Reducir zoom">
            <i class="fas fa-minus"></i>
          </button>
          <span class="pdf-controls__zoom" id="zoom-level">120%</span>
          <button class="pdf-controls__btn" id="btn-zoom-in" aria-label="Aumentar zoom">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="pdf-controls__group">
          <button class="pdf-controls__btn" id="btn-fullscreen" aria-label="Pantalla completa">
            <i class="fas fa-expand"></i>
          </button>
        </div>
        <div class="pdf-controls__group">
          <button class="pdf-controls__btn" id="btn-prev" aria-label="Página anterior">
            <i class="fas fa-chevron-left"></i>
          </button>
          <input type="number" class="pdf-controls__page-input" id="page-input" min="1" value="1" aria-label="Página actual">
          <span class="pdf-controls__total" id="page-total">/ 1</span>
          <button class="pdf-controls__btn" id="btn-next" aria-label="Página siguiente">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- Área del PDF -->
      <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper">
        <canvas class="pdf-canvas" id="pdf-canvas"></canvas>
      </div>

      <!-- Sidebar de secciones -->
      <aside class="pdf-sidebar" id="pdf-sidebar">
        <button class="pdf-sidebar__toggle" id="sidebar-toggle" aria-label="Abrir secciones">
          <i class="fas fa-list"></i>
        </button>
        <div class="pdf-sidebar__drawer" id="sidebar-drawer">
          <h3 class="pdf-sidebar__title">Secciones</h3>
          <ul class="pdf-sidebar__list" id="sections-list"></ul>
        </div>
      </aside>

      <!-- Barra de progreso inferior -->
      <div class="pdf-progress">
        <div class="pdf-progress__chapters">
          <span class="pdf-progress__label">Capítulos completados:</span>
          <span class="pdf-progress__value" id="progress-chapters">0 de 0</span>
        </div>
        <div class="pdf-progress__sections">
          <span class="pdf-progress__label">Progreso del capítulo:</span>
          <span class="pdf-progress__value" id="progress-sections">0 de 0 secciones</span>
        </div>
      </div>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="cultura.html" class="btn btn-primary animate-in">&larr; Volver a Cultura</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const chapterId = params.get('id');
      if (!chapterId) return;

      let pdfDoc = null;
      let paginaActual = 1;
      let escala = 1.2;
      let renderTask = null;

      var canvas = document.getElementById('pdf-canvas');
      var ctx = canvas.getContext('2d');
      var pageInput = document.getElementById('page-input');
      var pageTotal = document.getElementById('page-total');
      var zoomLevel = document.getElementById('zoom-level');
      var breadcrumbChapter = document.getElementById('breadcrumb-chapter');
      var btnZoomOut = document.getElementById('btn-zoom-out');
      var btnZoomIn = document.getElementById('btn-zoom-in');
      var btnPrev = document.getElementById('btn-prev');
      var btnNext = document.getElementById('btn-next');
      var btnFullscreen = document.getElementById('btn-fullscreen');
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var sidebarDrawer = document.getElementById('sidebar-drawer');
      var sectionsList = document.getElementById('sections-list');
      var progressChapters = document.getElementById('progress-chapters');
      var progressSections = document.getElementById('progress-sections');

      function renderizarPagina(numero) {
        if (!pdfDoc) return;
        if (numero < 1) numero = 1;
        if (numero > pdfDoc.numPages) numero = pdfDoc.numPages;
        paginaActual = numero;
        if (renderTask) { renderTask.cancel(); renderTask = null; }
        pdfDoc.getPage(numero).then(function(pagina) {
          var viewport = pagina.getViewport({ scale: escala });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          renderTask = pagina.render({ canvasContext: ctx, viewport: viewport });
          renderTask.promise.then(function() { renderTask = null; }).catch(function() {});
          pageInput.value = paginaActual;
          zoomLevel.textContent = Math.round(escala * 100) + '%';
          btnPrev.disabled = paginaActual <= 1;
          btnNext.disabled = paginaActual >= pdfDoc.numPages;
        });
      }

      function cambiarZoom(nuevaEscala) {
        escala = Math.max(0.5, Math.min(3, nuevaEscala));
        renderizarPagina(paginaActual);
      }

      btnZoomOut.addEventListener('click', function() { cambiarZoom(escala - 0.2); });
      btnZoomIn.addEventListener('click', function() { cambiarZoom(escala + 0.2); });
      btnPrev.addEventListener('click', function() { renderizarPagina(paginaActual - 1); });
      btnNext.addEventListener('click', function() { renderizarPagina(paginaActual + 1); });

      pageInput.addEventListener('change', function() {
        var val = parseInt(pageInput.value, 10);
        if (!isNaN(val)) renderizarPagina(val);
      });
      pageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var val = parseInt(pageInput.value, 10);
          if (!isNaN(val)) renderizarPagina(val);
        }
      });

      btnFullscreen.addEventListener('click', function() {
        var lector = document.querySelector('.pdf-lector');
        if (!document.fullscreenElement) {
          (lector.requestFullscreen || lector.webkitRequestFullscreen || lector.msRequestFullscreen).call(lector);
          btnFullscreen.querySelector('i').className = 'fas fa-compress';
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
          btnFullscreen.querySelector('i').className = 'fas fa-expand';
        }
      });

      document.addEventListener('fullscreenchange', function() {
        btnFullscreen.querySelector('i').className = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
      });

      sidebarToggle.addEventListener('click', function() {
        sidebarDrawer.classList.toggle('is-open');
        sidebarToggle.classList.toggle('is-active');
      });

      function estadoIcono(estado) {
        if (estado === 'completado') return '<i class="fas fa-check-circle estado-icon estado-completado"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente"></i>';
      }

      function renderizarSecciones(secciones) {
        sectionsList.innerHTML = secciones.map(function(s) {
          return '<li class="pdf-sidebar__item" data-pagina="' + s.pagina + '">' +
            '<span class="pdf-sidebar__icon">' + estadoIcono(s.estado) + '</span>' +
            '<span class="pdf-sidebar__text">' + s.titulo + '</span>' +
          '</li>';
        }).join('');

        sectionsList.querySelectorAll('.pdf-sidebar__item').forEach(function(item) {
          item.addEventListener('click', function() {
            var pagina = parseInt(item.getAttribute('data-pagina'), 10);
            if (!isNaN(pagina)) renderizarPagina(pagina);
            sidebarDrawer.classList.remove('is-open');
            sidebarToggle.classList.remove('is-active');
          });
        });
      }

      fetch('../data/cultura.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var capitulo = data.capitulos.find(function(c) { return c.id === chapterId; });
          if (!capitulo) return;

          breadcrumbChapter.textContent = capitulo.subtitulo;
          renderizarSecciones(capitulo.secciones);

          progressChapters.textContent = capitulo.capitulosCompletados + ' de ' + capitulo.capitulosTotal;
          var completadas = capitulo.secciones.filter(function(s) { return s.estado === 'completado'; }).length;
          progressSections.textContent = completadas + ' de ' + capitulo.secciones.length + ' secciones';

          var rutaPdf = '../assets/' + capitulo.archivoPdf;

          pdfjsLib.getDocument(rutaPdf).promise.then(function(pdf) {
            pdfDoc = pdf;
            pageTotal.textContent = '/ ' + pdf.numPages;
            pageInput.max = pdf.numPages;
            renderizarPagina(paginaActual);
          });
        })
        .catch(function(err) { console.error('Error cargando PDF:', err); });
    })();
  </script>
</body>
</html>
