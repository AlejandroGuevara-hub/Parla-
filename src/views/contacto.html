<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">

<body class="contact-page">

  <section class="contact-hero">
    <img class="contact-hero__bg" src="../assets/images/contact-bg.png" alt="">

    <a href="index.html" class="contact-hero__logo" aria-label="Parla! inicio">
      <img src="../assets/images/logo.png" alt="Parla! logo">
    </a>

    <h1 class="contact-hero__title animate-in">ACOMPA&Ntilde;AMIENTO CONTINUO</h1>

    <img class="contact-hero__icon animate-in" src="../assets/images/contact-icon.png" alt="">

    <div class="contact-hero__whatsapp animate-in">
      <a class="contact-hero__phone" href="tel:+573182534487">(+57) 318 253 4487</a>
      <a class="btn btn-whatsapp" href="https://wa.me/573182534487" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
        Escr&iacute;benos en WhatsApp
      </a>
    </div>
  </section>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
</body>
</html>
