<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultura — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <parla-sidebar current="cultura"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon culture" aria-hidden="true"><i class="fas fa-landmark"></i></div>
        <h1 class="dashboard__title">Cultura</h1>
        <p class="dashboard__subtitle">Explora la cultura italiana: arte, historia, gastronomía y tradiciones</p>
      </div>

      <!-- Banner Continuar -->
      <div class="continue-banner" id="continue-banner" aria-label="Continuar donde te quedaste"></div>

      <!-- Lista de temas -->
      <ul class="topics-list" id="topics-list" aria-label="Temas de cultura"></ul>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="inicio.html" class="btn btn-primary animate-in">&larr; Volver al inicio</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    (function() {
      var bannerEl = document.getElementById('continue-banner');
      var listEl = document.getElementById('topics-list');

      function estadoIcon(estado) {
        if (estado === 'completado') return '<i class="fas fa-check-circle estado-icon estado-completado" aria-label="Completado"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente" aria-label="Pendiente"></i>';
      }

      function renderBanner(data) {
        if (!data.capitulos || !data.capitulos.length) return;
        var activo = data.capitulos.find(function(c) {
          return c.secciones.some(function(s) { return s.estado !== 'completado'; });
        }) || data.capitulos[0];
        bannerEl.innerHTML = '<div class="continue-banner__icon"><i class="fas fa-landmark"></i></div>' +
          '<div class="continue-banner__content">' +
            '<span class="continue-banner__label">Sigue explorando</span>' +
            '<h2 class="continue-banner__title">' + activo.subtitulo + '</h2>' +
          '</div>' +
          '<a href="cultura-lector.html?id=' + activo.id + '" class="btn btn-primary continue-banner__btn">Ver capítulo</a>';
        bannerEl.classList.add('animate-in');
      }

      function renderChapters(data) {
        var capitulos = data.capitulos || [];
        listEl.innerHTML = capitulos.map(function(c, idx) {
          var completadas = c.secciones.filter(function(s) { return s.estado === 'completado'; }).length;
          return '<li class="topic-item animate-in" style="transition-delay: ' + (idx * 80) + 'ms">' +
            '<span class="topic-item__icon">' + estadoIcon(completadas === c.secciones.length ? 'completado' : 'pendiente') + '</span>' +
            '<span class="topic-item__title">' + c.titulo + ' · ' + c.subtitulo + '</span>' +
            '<a href="cultura-lector.html?id=' + c.id + '" class="btn btn-small topic-item__btn">Abrir</a>' +
          '</li>';
        }).join('');
      }

      fetch('../data/cultura.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          renderBanner(data);
          renderChapters(data);
        })
        .catch(function(err) { console.error('Error cargando cultura:', err); });
    })();
  </script>
</body>
</html>
