  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon culture" aria-hidden="true"><i class="fas fa-landmark"></i></div>

      </div>

      <!-- Banner Continuar -->

      <!-- Lista de temas -->

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script src="../scripts/sidebar.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Cultura - fetch y render
    (function() {
      const bannerEl = document.getElementById('continue-banner');
      const listEl = document.getElementById('topics-list');

      function estadoIcon(estado) {
        if (estado === 'completado') return '<i class="fas fa-check-circle estado-icon estado-completado" aria-label="Completado"></i>';
        if (estado === 'en-progreso') return '<i class="fas fa-circle-notch estado-icon estado-progreso" aria-label="En progreso"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente" aria-label="Pendiente"></i>';
      }

      function estadoLabel(estado) {
        return estado === 'completado' ? 'Completado' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderBanner(data) {
        const c = data.continuar;
        if (!c) return;
        bannerEl.innerHTML = `
          <div class="continue-banner__icon"><i class="fas fa-landmark"></i></div>
          <div class="continue-banner__content">
            <span class="continue-banner__label">Sigue explorando</span>
            <h2 class="continue-banner__title">${c.temaTitulo}</h2>
          </div>
          <button class="btn btn-primary continue-banner__btn">Ver tema</button>
        `;
        bannerEl.classList.add('animate-in');
      }

      function renderTopics(data) {
        const temas = data.temas || [];
        listEl.innerHTML = temas.map((t, idx) => `
          <li class="topic-item animate-in" style="transition-delay: ${idx * 80}ms">
            <span class="topic-item__icon">${estadoIcon(t.estado)}</span>
            <span class="topic-item__title">${t.titulo}</span>
            <span class="topic-item__estado">${estadoLabel(t.estado)}</span>
          </li>
        `).join('');
      }

      fetch('../data/cultura.json')
        .then(r => r.json())
        .then(data => {
          renderBanner(data);
          renderTopics(data);
        })
        .catch(err => console.error('Error cargando cultura:', err));
    })();
  </script>
</body>
