<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial_scale=1.0">
  <title>Flashcards — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <parla-sidebar current="flashcards"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon flashcards" aria-hidden="true"><i class="fas fa-layer-group"></i></div>
        <h1 class="dashboard__title">Flashcards</h1>
        <p class="dashboard__subtitle">Repasa vocabulario y frases con tarjetas que se adaptan a tu memoria</p>
      </div>

      <!-- Banner Continuar -->
      <div class="continue-banner" id="continue-banner" aria-label="Continuar donde te quedaste"></div>

      <!-- Grid de mazos -->
      <div class="decks-grid" id="decks-grid" aria-label="Mazos de flashcards"></div>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="inicio.html" class="btn btn-primary animate-in">&larr; Volver al inicio</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Flashcards - fetch y render
    (function() {
      const bannerEl = document.getElementById('continue-banner');
      const gridEl = document.getElementById('decks-grid');

      function estadoIcon(estado) {
        if (estado === 'completado') return '<i class="fas fa-check-circle estado-icon estado-completado" aria-label="Completado"></i>';
        if (estado === 'en-progreso') return '<i class="fas fa-circle-notch estado-icon estado-progreso" aria-label="En progreso"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente" aria-label="Pendiente"></i>';
      }

      function estadoLabel(estado) {
        return estado === 'completado' ? 'Completado' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderBanner(data) {
        const c = data.continuar;
        if (!c) return;
        bannerEl.innerHTML = `
          <div class="continue-banner__icon"><i class="fas fa-layer-group"></i></div>
          <div class="continue-banner__content">
            <span class="continue-banner__label">Repasa tu próximo mazo</span>
            <h2 class="continue-banner__title">${c.mazoTitulo}</h2>
            <div class="continue-banner__progress" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
              <div class="continue-banner__progress-bar" style="width: 40%"></div>
            </div>
            <span class="continue-banner__progress-text">40% dominado (12/30)</span>
          </div>
          <button class="btn btn-primary continue-banner__btn">Repasar</button>
        `;
        bannerEl.classList.add('animate-in');
      }

      function renderDecks(data) {
        const mazos = data.mazos || [];
        gridEl.innerHTML = mazos.map((m, idx) => `
          <article class="deck-card animate-in" style="transition-delay: ${idx * 80}ms">
            <div class="deck-card__header">
              <span class="deck-card__icon">${estadoIcon(m.estado)}</span>
              <h2 class="deck-card__title">${m.titulo}</h2>
            </div>
            <div class="deck-card__progress">
              <div class="deck-card__progress-bar-wrap">
                <div class="deck-card__progress-bar" style="width: ${Math.round((m.dominadas / m.totalTarjetas) * 100)}%"></div>
              </div>
              <span class="deck-card__progress-text">${m.dominadas} / ${m.totalTarjetas} tarjetas</span>
            </div>
            <span class="deck-card__estado">${estadoLabel(m.estado)}</span>
            <button class="btn btn-primary deck-card__btn">Repasar</button>
          </article>
        `).join('');
      }

      fetch('../data/flashcards.json')
        .then(r => r.json())
        .then(data => {
          renderBanner(data);
          renderDecks(data);
        })
        .catch(err => console.error('Error cargando flashcards:', err));
    })();
  </script>
</body>
</html>
