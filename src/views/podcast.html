<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <parla-sidebar current="podcast"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon podcast" aria-hidden="true"><i class="fas fa-headphones"></i></div>
        <h1 class="dashboard__title">Podcast</h1>
        <p class="dashboard__subtitle">Episodios con transcripción para mejorar tu comprensión auditiva</p>
      </div>

      <!-- Banner Continuar -->
      <div class="continue-banner" id="continue-banner" aria-label="Continuar donde te quedaste"></div>

      <!-- Lista de episodios -->
      <ul class="episodes-list" id="episodes-list" aria-label="Episodios del podcast"></ul>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="inicio.html" class="btn btn-primary animate-in">&larr; Volver al inicio</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Podcast - fetch y render
    (function() {
      const bannerEl = document.getElementById('continue-banner');
      const listEl = document.getElementById('episodes-list');

      function estadoIcon(estado) {
        if (estado === 'escuchado') return '<i class="fas fa-check-circle estado-icon estado-completado" aria-label="Escuchado"></i>';
        if (estado === 'en-progreso') return '<i class="fas fa-circle-notch estado-icon estado-progreso" aria-label="En progreso"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente" aria-label="Pendiente"></i>';
      }

      function estadoLabel(estado) {
        return estado === 'escuchado' ? 'Escuchado' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderBanner(data) {
        const c = data.continuar;
        if (!c) return;
        bannerEl.innerHTML = `
          <div class="continue-banner__icon"><i class="fas fa-headphones"></i></div>
          <div class="continue-banner__content">
            <span class="continue-banner__label">Sigue escuchando</span>
            <h2 class="continue-banner__title">${c.episodioTitulo}</h2>
            <p class="continue-banner__detail">Duración: ${c.duracion}</p>
          </div>
          <button class="btn btn-primary continue-banner__btn">Reproducir</button>
        `;
        bannerEl.classList.add('animate-in');
      }

      function renderEpisodes(data) {
        const episodios = data.episodios || [];
        listEl.innerHTML = episodios.map((ep, idx) => `
          <li class="episode-item animate-in" style="transition-delay: ${idx * 80}ms">
            <button class="episode-item__play" aria-label="Reproducir ${ep.titulo}">
              <i class="fas fa-play"></i>
            </button>
            <div class="episode-item__info">
              <span class="episode-item__icon">${estadoIcon(ep.estado)}</span>
              <a class="episode-item__title" href="episodio-detalle.html?id=${ep.id}">${ep.titulo}</a>
              ${ep.transcripcion ? '<span class="episode-item__transcripcion"><i class="fas fa-file-alt"></i> Transcripción</span>' : ''}
            </div>
            <span class="episode-item__duracion">${ep.duracion}</span>
            <span class="episode-item__estado">${estadoLabel(ep.estado)}</span>
          </li>
        `).join('');
      }

      fetch('../data/podcast.json')
        .then(r => r.json())
        .then(data => {
          renderBanner(data);
          renderEpisodes(data);
        })
        .catch(err => console.error('Error cargando podcast:', err));
    })();
  </script>
</body>
</html>
