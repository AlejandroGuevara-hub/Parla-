<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Parla! inicio">
        <img src="../assets/images/logo.png" alt="Parla! logo">
        <span>Parla!</span>
      </a>
      <button class="nav-toggle" aria-label="Abrir menú de navegación" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav aria-label="Navegación principal">
        <ul class="nav-links">
          <li><a href="index.html">Cerrar sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="display:flex;align-items:center;justify-content:center;min-height:60vh;padding:var(--space-md);text-align:center;">
    <div>
      <h1 style="font-family:var(--font-display);font-size:var(--fs-h1);color:var(--color-primary);margin-bottom:var(--space-sm);">
        ¡Bienvenido a Parla!
      </h1>
      <p style="color:var(--color-text-muted);font-size:1rem;max-width:500px;margin:0 auto;">
        Tu viaje por el italiano comienza aquí. <br>
        (Próximamente: lecciones, podcasts, webtoons y más.)
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/theme.js"></script>
</body>
</html>
