<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecciones en video — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <parla-sidebar current="video"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon video" aria-hidden="true"><i class="fas fa-video"></i></div>
        <h1 class="dashboard__title">Lecciones en video</h1>
        <p class="dashboard__subtitle">Aprende paso a paso con lecciones en video, a tu propio ritmo</p>
      </div>

      <!-- Banner Continuar -->
      <div class="continue-banner" id="continue-banner" aria-label="Continuar donde te quedaste"></div>

      <!-- Lista de módulos (acordeón) -->
      <div class="modules-list" id="modules-list" aria-label="Módulos de lecciones"></div>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="inicio.html" class="btn btn-primary animate-in">&larr; Volver al inicio</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Lecciones en video - fetch y render
    (function() {
      const bannerEl = document.getElementById('continue-banner');
      const listEl = document.getElementById('modules-list');

      function estadoIcon(estado, progreso) {
        if (estado === 'completado') return '<i class="fas fa-check-circle estado-icon estado-completado" aria-label="Completado"></i>';
        if (estado === 'en-progreso') return '<i class="fas fa-circle-notch estado-icon estado-progreso" aria-label="En progreso"></i>';
        return '<i class="far fa-circle estado-icon estado-pendiente" aria-label="Pendiente"></i>';
      }

      function estadoLabel(estado) {
        return estado === 'completado' ? 'Completado' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderBanner(data) {
        const c = data.continuar;
        if (!c) return;
        bannerEl.innerHTML = `
          <div class="continue-banner__icon"><i class="fas fa-video"></i></div>
          <div class="continue-banner__content">
            <span class="continue-banner__label">Continúa tu aprendizaje</span>
            <h2 class="continue-banner__title">${c.moduloTitulo}</h2>
            <p class="continue-banner__detail">${c.detalle}</p>
            <div class="continue-banner__progress" role="progressbar" aria-valuenow="${c.progreso}" aria-valuemin="0" aria-valuemax="100">
              <div class="continue-banner__progress-bar" style="width: ${c.progreso}%"></div>
            </div>
            <span class="continue-banner__progress-text">${c.progreso}% completado</span>
          </div>
          <button class="btn btn-primary continue-banner__btn">Continuar</button>
        `;
        bannerEl.classList.add('animate-in');
      }

      function renderModules(data) {
        const modulos = data.modulos || [];
        listEl.innerHTML = modulos.map((mod, idx) => `
          <article class="module-card animate-in" style="transition-delay: ${idx * 80}ms">
            <header class="module-card__header">
              <div class="module-card__icon">
                ${estadoIcon(mod.estado)}
              </div>
              <div class="module-card__titles">
                <h2 class="module-card__title">${mod.titulo}</h2>
                <p class="module-card__subtitle">${mod.subtitulo}</p>
              </div>
              <span class="module-card__badge">${estadoLabel(mod.estado)}</span>
              <button class="module-card__toggle" aria-expanded="false" aria-controls="module-${mod.id}-lessons">
                <i class="fas fa-chevron-down"></i>
              </button>
            </header>
            <ul id="module-${mod.id}-lessons" class="lessons-list" hidden>
              ${mod.lecciones.map(lecc => `
                <li class="lesson-item">
                  <span class="lesson-item__icon">${estadoIcon(lecc.estado, lecc.progreso)}</span>
                  <a class="lesson-item__title" href="leccion-detalle.html?id=${lecc.id}">${lecc.titulo}</a>
                  ${lecc.estado === 'en-progreso' && lecc.progreso ? `<span class="lesson-item__progress">${lecc.progreso}%</span>` : ''}
                </li>
              `).join('')}
            </ul>
          </article>
        `).join('');

        // Acordeón: click en header abre/cierra
        listEl.querySelectorAll('.module-card__header').forEach(header => {
          header.addEventListener('click', () => {
            const card = header.closest('.module-card');
            const list = card.querySelector('.lessons-list');
            const toggle = header.querySelector('.module-card__toggle');
            const isOpen = !list.hidden;
            list.hidden = isOpen;
            toggle.setAttribute('aria-expanded', !isOpen);
            toggle.querySelector('i').style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
          });
        });
      }

      fetch('../data/lecciones.json')
        .then(r => r.json())
        .then(data => {
          renderBanner(data);
          renderModules(data);
        })
        .catch(err => console.error('Error cargando lecciones:', err));
    })();
  </script>
</body>
</html>
