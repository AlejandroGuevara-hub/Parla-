<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webtoon — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <div class="webtoon-progreso" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
    <div class="webtoon-progreso__barra"></div>
  </div>

  <parla-sidebar current="webtoon"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon webtoon" aria-hidden="true"><i class="fas fa-book-open"></i></div>
        <h1 class="dashboard__title">Webtoon</h1>
        <p class="dashboard__subtitle">Detalle del episodio</p>
      </div>

      <div id="webtoon-content"></div>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="webtoon.html" class="btn btn-primary animate-in">&larr; Volver al webtoon</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Webtoon Lector - plantilla dinámica
    (function() {
      var contentEl = document.getElementById('webtoon-content');
      var params = new URLSearchParams(window.location.search);
      var idEpisodio = params.get('id');

      function estadoLabel(estado) {
        return estado === 'leido' ? 'Leído' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderizarNoEncontrado() {
        contentEl.innerHTML =
          '<div class="lesson-notfound animate-in">' +
            '<i class="fas fa-circle-exclamation lesson-notfound__icon"></i>' +
            '<h2 class="lesson-notfound__title">Episodio no encontrado</h2>' +
            '<p class="lesson-notfound__text">El enlace no corresponde a un episodio válido.</p>' +
            '<a href="webtoon.html" class="btn btn-primary">Volver al webtoon</a>' +
          '</div>';
      }

      function renderizarPanel(panel, idx) {
        return '<figure class="webtoon-panel animate-in" style="transition-delay:' + (idx * 80) + 'ms">' +
          '<img src="../assets/' + panel.imagen + '" ' +
            'alt="' + panel.alt + '" ' +
            'loading="lazy" ' +
            'onerror="this.parentElement.innerHTML=\'<div class=webtoon-panel-placeholder><i class=fas fa-book-open></i><span>Panel ' + (idx + 1) + '</span></div>\'">' +
        '</figure>';
      }

      function renderizarEpisodio(episodio, index, episodios) {
        var prev = episodios[index - 1];
        var next = episodios[index + 1];
        var paneles = episodio.paneles || [];

        var panelesHtml = paneles.map(function(p, idx) {
          return renderizarPanel(p, idx);
        }).join('');

        contentEl.innerHTML =
          '<article class="episodio-detalle animate-in">' +
            '<div class="episodio-detalle__header">' +
              '<span class="episodio-detalle__badge">' + estadoLabel(episodio.estado) + '</span>' +
            '</div>' +
            '<h2 class="episodio-detalle__title">' + episodio.titulo + '</h2>' +

            '<div class="webtoon-paneles">' +
              panelesHtml +
            '</div>' +

            '<nav class="lesson-nav" aria-label="Navegación entre episodios">' +
              (prev
                ? '<a class="btn btn-secondary lesson-nav__btn" href="webtoon-lector.html?id=' + prev.id + '">' +
                    '<i class="fas fa-arrow-left"></i>' +
                    '<span class="lesson-nav__wrap">' +
                      '<small>Episodio anterior</small>' +
                      '<span>' + prev.titulo + '</span>' +
                    '</span>' +
                  '</a>'
                : '<span class="btn btn-secondary lesson-nav__btn lesson-nav__btn--disabled">' +
                    '<i class="fas fa-arrow-left"></i>' +
                    '<span class="lesson-nav__wrap"><small>Episodio anterior</small></span>' +
                  '</span>') +
              (next
                ? '<a class="btn btn-secondary lesson-nav__btn lesson-nav__btn--next" href="webtoon-lector.html?id=' + next.id + '">' +
                    '<span class="lesson-nav__wrap">' +
                      '<small>Episodio siguiente</small>' +
                      '<span>' + next.titulo + '</span>' +
                    '</span>' +
                    '<i class="fas fa-arrow-right"></i>' +
                  '</a>'
                : '<span class="btn btn-secondary lesson-nav__btn lesson-nav__btn--next lesson-nav__btn--disabled">' +
                    '<span class="lesson-nav__wrap"><small>Episodio siguiente</small></span>' +
                    '<i class="fas fa-arrow-right"></i>' +
                  '</span>') +
            '</nav>' +
          '</article>';
      }

      fetch('../data/webtoon.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var episodios = data.episodios || [];
          var index = episodios.findIndex(function(ep) { return ep.id === idEpisodio; });
          if (index === -1) {
            renderizarNoEncontrado();
          } else {
            renderizarEpisodio(episodios[index], index, episodios);
          }
        })
        .catch(function(err) {
          console.error('Error cargando webtoon:', err);
          renderizarNoEncontrado();
        });
    })();
  </script>
  <script>
    // Barra de progreso de lectura (visual, de sesión)
    window.addEventListener('scroll', function() {
      var scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
      var scrollActual = window.scrollY;
      var porcentaje = Math.min(100, Math.max(0, (scrollActual / scrollTotal) * 100));
      var barra = document.querySelector('.webtoon-progreso__barra');
      if (barra) barra.style.width = porcentaje + '%';
    });
  </script>
</body>
</html>
