<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episodio — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <parla-sidebar current="podcast"></parla-sidebar>
  <parla-user-nav></parla-user-nav>

  <main class="page-content">
    <section class="dashboard animate-in">
      <div class="dashboard__header animate-in">
        <div class="icon podcast" aria-hidden="true"><i class="fas fa-headphones"></i></div>
        <h1 class="dashboard__title">Episodio</h1>
        <p class="dashboard__subtitle">Detalle del episodio</p>
      </div>

      <!-- Contenido del episodio -->
      <div id="episodio-content"></div>

      <div style="text-align:center;margin-top:var(--space-lg)">
        <a href="podcast.html" class="btn btn-primary animate-in">&larr; Volver al podcast</a>
      </div>
    </section>
  </main>

  <footer class="site-footer animate-in">
    <p>&copy; 2026 Parla! — Todos los derechos reservados.</p>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script type="module" src="../scripts/components/sidebar.js"></script>
  <script type="module" src="../scripts/components/user-nav.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
  <script>
    // Episodio - plantilla dinámica
    (function() {
      const contentEl = document.getElementById('episodio-content');

      const params = new URLSearchParams(window.location.search);
      const idEpisodio = params.get('id');

      function estadoLabel(estado) {
        return estado === 'escuchado' ? 'Escuchado' : estado === 'en-progreso' ? 'En progreso' : 'Pendiente';
      }

      function renderizarNoEncontrada() {
        contentEl.innerHTML = `
          <div class="lesson-notfound animate-in">
            <i class="fas fa-circle-exclamation lesson-notfound__icon"></i>
            <h2 class="lesson-notfound__title">Episodio no encontrado</h2>
            <p class="lesson-notfound__text">El enlace no corresponde a un episodio válido.</p>
            <a href="podcast.html" class="btn btn-primary">Volver al podcast</a>
          </div>
        `;
      }

      function renderizarEpisodio(episodio, index, episodios) {
        const prev = episodios[index - 1];
        const next = episodios[index + 1];

        contentEl.innerHTML = `
          <article class="episodio-detalle animate-in">
            <div class="episodio-detalle__header">
              <span class="episodio-detalle__badge">${estadoLabel(episodio.estado)}</span>
            </div>
            <h2 class="episodio-detalle__title">${episodio.titulo}</h2>

            <div class="episodio-imagen-placeholder animate-in">
              <i class="fa-solid fa-headphones"></i>
            </div>

            <div class="reproductor-simulado animate-in">
              <button class="reproductor-simulado__play" aria-label="Reproducir">
                <i class="fa-solid fa-play"></i>
              </button>
              <div class="reproductor-simulado__barra">
                <div class="reproductor-simulado__progreso"></div>
              </div>
              <span class="reproductor-simulado__duracion">0:00 / <span data-duracion>${episodio.duracion}</span></span>
            </div>

            <div class="transcripcion-placeholder animate-in">
              <div class="skeleton-line" style="width: 90%"></div>
              <div class="skeleton-line" style="width: 95%"></div>
              <div class="skeleton-line" style="width: 80%"></div>
              <div class="skeleton-line" style="width: 88%"></div>
            </div>

            <nav class="lesson-nav" aria-label="Navegación entre episodios">
              ${prev
                ? `<a class="btn btn-secondary lesson-nav__btn" href="episodio-detalle.html?id=${prev.id}">
                     <i class="fas fa-arrow-left"></i>
                     <span class="lesson-nav__wrap">
                       <small>Episodio anterior</small>
                       <span>${prev.titulo}</span>
                     </span>
                   </a>`
                : `<span class="btn btn-secondary lesson-nav__btn lesson-nav__btn--disabled">
                     <i class="fas fa-arrow-left"></i>
                     <span class="lesson-nav__wrap"><small>Episodio anterior</small></span>
                   </span>`}
              ${next
                ? `<a class="btn btn-secondary lesson-nav__btn lesson-nav__btn--next" href="episodio-detalle.html?id=${next.id}">
                     <span class="lesson-nav__wrap">
                       <small>Episodio siguiente</small>
                       <span>${next.titulo}</span>
                     </span>
                     <i class="fas fa-arrow-right"></i>
                   </a>`
                : `<span class="btn btn-secondary lesson-nav__btn lesson-nav__btn--next lesson-nav__btn--disabled">
                     <span class="lesson-nav__wrap"><small>Episodio siguiente</small></span>
                     <i class="fas fa-arrow-right"></i>
                   </span>`}
            </nav>
          </article>
        `;

        // Botón play/pausa simulado (no reproduce audio real)
        const boton = contentEl.querySelector('.reproductor-simulado__play');
        const icono = boton.querySelector('i');
        let reproduciendo = false;
        boton.addEventListener('click', () => {
          reproduciendo = !reproduciendo;
          icono.classList.toggle('fa-play', !reproduciendo);
          icono.classList.toggle('fa-pause', reproduciendo);
          boton.setAttribute('aria-label', reproduciendo ? 'Pausar' : 'Reproducir');
        });
      }

      fetch('../data/podcast.json')
        .then(res => res.json())
        .then(data => {
          const episodios = data.episodios || [];
          const index = episodios.findIndex(ep => ep.id === idEpisodio);
          if (index === -1) {
            renderizarNoEncontrada();
          } else {
            renderizarEpisodio(episodios[index], index, episodios);
          }
        })
        .catch(err => {
          console.error('Error cargando episodio:', err);
          renderizarNoEncontrada();
        });
    })();
  </script>
</body>
</html>
