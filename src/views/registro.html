<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Parla!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card card">
      <a href="index.html" class="logo" aria-label="Parla! inicio">
        <img src="../assets/images/logo.png" alt="Parla! logo">
        <span>Parla!</span>
      </a>
      <h1>Crear cuenta</h1>

      <form data-navegar="inicio.html" novalidate>
        <div class="input-field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="María Rossi" required autocomplete="name">
        </div>

        <div class="input-field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
        </div>

        <div class="input-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
        </div>

        <div class="input-field">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite la contraseña" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>

      <p class="form-toggle">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="../scripts/nav.js"></script>
</body>
</html>
