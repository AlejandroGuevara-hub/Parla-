<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Parla!</title>
  <script>!function(){var t=localStorage.getItem("parla-theme");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <a href="index.html" class="sidebar__logo" aria-label="Parla! inicio">
      <img src="../assets/images/logo.png" alt="Parla! logo">
    </a>
    <nav aria-label="Secciones">
      <ul class="sidebar-links">
        <li><a class="sidebar-link" href="inicio.html"><i class="fas fa-house"></i><span>Inicio</span></a></li>
        <li><a class="sidebar-link" href="video.html"><i class="fas fa-video"></i><span>Lecciones en video</span></a></li>
        <li><a class="sidebar-link" href="podcast.html"><i class="fas fa-headphones"></i><span>Podcast</span></a></li>
        <li><a class="sidebar-link" href="webtoon.html"><i class="fas fa-book-open"></i><span>Webtoon</span></a></li>
        <li><a class="sidebar-link" href="cultura.html"><i class="fas fa-landmark"></i><span>Cultura</span></a></li>
        <li><a class="sidebar-link" href="flashcards.html"><i class="fas fa-layer-group"></i><span>Flashcards</span></a></li>
        <li><a class="sidebar-link" href="quizzes.html"><i class="fas fa-circle-question"></i><span>Quizzes</span></a></li>
        <li><a class="sidebar-link" href="contacto.html"><i class="fas fa-comment"></i><span>Contactos</span></a></li>
      </ul>
    </nav>
  </aside>

  <div class="sidebar-overlay" aria-hidden="true"></div>

  <button class="sidebar-toggle" aria-label="Abrir menú" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="floating-user-nav animate-in" aria-label="Navegación de usuario">
    <ul class="user-nav">
      <li><a href="#" aria-label="Perfil"><i class="fas fa-user"></i><span>Perfil</span></a></li>
      <li><a href="index.html" aria-label="Cerrar sesión"><i class="fas fa-right-from-bracket"></i><span>Salir</span></a></li>
    </ul>
  </nav>

  <main class="auth-page page-content">
    <div class="auth-card card animate-in">
      <a href="index.html" class="logo animate-in" aria-label="Parla! inicio">
        <img src="../assets/images/logo.png" alt="Parla! logo">
        <span>Parla!</span>
      </a>
      <h1 class="animate-in">Crear cuenta</h1>

      <form data-navegar="login.html" novalidate class="animate-in">
        <div class="input-field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="María Rossi" required autocomplete="name">
        </div>

        <div class="input-field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
        </div>

        <div class="input-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
        </div>

        <div class="input-field">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite la contraseña" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>

      <p class="form-toggle animate-in">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </main>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro">
    <i class="fas fa-moon"></i>
  </button>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/sidebar.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/animations.js"></script>
</body>
</html>
